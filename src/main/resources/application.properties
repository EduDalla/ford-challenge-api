spring.application.name=pulso-retencao
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/pulso_retencao?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo}
spring.datasource.username=${DB_USERNAME:pulso}
spring.datasource.password=${DB_PASSWORD:pulso123}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

ford.ml.base-url=${FORD_ML_BASE_URL:${ML_API_BASE_URL:https://ford-vinguard-api.onrender.com}}
ford.ml.service-token=${FORD_ML_SERVICE_TOKEN:}
ford.ml.timeout-ms=${FORD_ML_TIMEOUT_MS:8000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
api.security.token.secret=${JWT_SECRET:dev-secret-pulso-retencao}
