spring.application.name=pulso-retencao
server.port=${PORT:8080}

spring.datasource.url=${DB_URL:${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/pulso_retencao}}
spring.datasource.username=${DB_USERNAME:${SPRING_DATASOURCE_USERNAME:postgres}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:postgres}}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration-postgres

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

ford.ml.base-url=${FORD_ML_BASE_URL:${ML_API_BASE_URL:https://ford-vinguard-api.onrender.com}}
ford.ml.service-token=${FORD_ML_SERVICE_TOKEN:}
ford.ml.timeout-ms=${FORD_ML_TIMEOUT_MS:8000}

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}
api.security.token.secret=${JWT_SECRET:dev-secret-pulso-retencao}
supabase.jwt.secret=${SUPABASE_JWT_SECRET:}
supabase.jwks-url=${SUPABASE_JWKS_URL:}
supabase.jwt.issuer=${SUPABASE_JWT_ISSUER:}
supabase.jwt.audience=${SUPABASE_JWT_AUDIENCE:authenticated}
