spring.datasource.url=jdbc:h2:mem:pulso_retencao;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=PRIVATE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

spring.task.scheduling.enabled=false
app.jobs.refresh-feature-snapshots.enabled=false
app.jobs.processar-predicoes-ml.enabled=false
