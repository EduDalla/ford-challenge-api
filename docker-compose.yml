services:
  postgres:
    image: postgres:16-alpine
    container_name: pulso-retencao-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulso_retencao}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pulso-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pulso_retencao}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulso-retencao-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${APP_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pulso_retencao}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pulso-postgres-data:
