services:
  postgres:
    image: postgres:16-alpine
    container_name: pulso-retencao-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pulso_retencao}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pulso-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-pulso_retencao}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulso-retencao-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: ${APP_PORT:-8080}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-pulso_retencao}
      DB_USERNAME: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8081}
      SUPABASE_JWKS_URL: ${SUPABASE_JWKS_URL:-}
      SUPABASE_JWT_ISSUER: ${SUPABASE_JWT_ISSUER:-}
      SUPABASE_JWT_AUDIENCE: ${SUPABASE_JWT_AUDIENCE:-authenticated}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET:-}
      FORD_ML_BASE_URL: ${FORD_ML_BASE_URL:-https://ford-vinguard-api.onrender.com}
      FORD_ML_SERVICE_TOKEN: ${FORD_ML_SERVICE_TOKEN:-}
      FORD_ML_TIMEOUT_MS: ${FORD_ML_TIMEOUT_MS:-8000}
      FORD_ML_MODEL_VERSION: ${FORD_ML_MODEL_VERSION:-churn_pos_venda_rf_calibrated}
      DEMO_MODE: ${DEMO_MODE:-false}
      JAVA_ML_DEMO_TOKEN: ${JAVA_ML_DEMO_TOKEN:-}
      APP_JOBS_REFRESH_FEATURE_SNAPSHOTS_ENABLED: ${APP_JOBS_REFRESH_FEATURE_SNAPSHOTS_ENABLED:-true}
      APP_JOBS_REFRESH_FEATURE_SNAPSHOTS_CRON: ${APP_JOBS_REFRESH_FEATURE_SNAPSHOTS_CRON:-0 */30 * * * *}
      APP_JOBS_REFRESH_FEATURE_SNAPSHOTS_BATCH_SIZE: ${APP_JOBS_REFRESH_FEATURE_SNAPSHOTS_BATCH_SIZE:-100}
      APP_JOBS_PROCESSAR_PREDICOES_ML_ENABLED: ${APP_JOBS_PROCESSAR_PREDICOES_ML_ENABLED:-true}
      APP_JOBS_PROCESSAR_PREDICOES_ML_CRON: ${APP_JOBS_PROCESSAR_PREDICOES_ML_CRON:-0 0 23 * * SUN}
      APP_JOBS_PROCESSAR_PREDICOES_ML_BATCH_SIZE: ${APP_JOBS_PROCESSAR_PREDICOES_ML_BATCH_SIZE:-100}
      APP_JOBS_PROCESSAR_PREDICOES_ML_MAX_ATTEMPTS: ${APP_JOBS_PROCESSAR_PREDICOES_ML_MAX_ATTEMPTS:-3}
      APP_JOBS_PROCESSAR_PREDICOES_ML_RETRY_DELAY_MINUTES: ${APP_JOBS_PROCESSAR_PREDICOES_ML_RETRY_DELAY_MINUTES:-60}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pulso-postgres-data:
