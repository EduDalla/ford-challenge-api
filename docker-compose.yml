services:
  mysql:
    image: mysql:8.0
    container_name: pulso-retencao-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-pulso_retencao}
      MYSQL_USER: ${MYSQL_APP_USER:?Defina MYSQL_APP_USER no arquivo .env}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Defina MYSQL_ROOT_PASSWORD no arquivo .env}
      TZ: ${TZ:-America/Sao_Paulo}
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - pulso-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulso-retencao-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: ${APP_PORT:-8080}
      DB_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-pulso_retencao}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=${TZ:-America/Sao_Paulo}
      DB_USERNAME: ${MYSQL_APP_USER:?Defina MYSQL_APP_USER no arquivo .env}
      DB_PASSWORD: ${MYSQL_APP_PASSWORD:?Defina MYSQL_APP_PASSWORD no arquivo .env}
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}
    ports:
      - "${APP_PORT:-8080}:8080"

volumes:
  pulso-mysql-data:
