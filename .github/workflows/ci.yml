name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Testes e cobertura
        run: |
          chmod +x mvnw
          ./mvnw -B test
      - name: Publicar Surefire e JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          if-no-files-found: warn
          path: |
            target/surefire-reports/**
            target/site/jacoco/**
